<div class="container">

  <div>
    <input type="radio" id="language" name="language" value="java">

  </div>
  <div>
    <input type="radio" id="language" name="language" value="c">

  </div>

    <input type="radio" id="language" name="language" value="python">
    <label for="java" id="label3">Python</label>
  </div>
  <div>
    <input type="radio" id="language" name="language" value="javascript">
    <label for="java" id="label4">Javascript</label>
  </div>
    </div>
 
    <div class="btn "><button type="submit" class="btn1 language">Submit</button></div>
   
  </form>
  </div>

      <div class="options">
        <div>
